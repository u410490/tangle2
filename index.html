    <script>
        // --- Global Constants & Configurations ---
        const NUM_SEGMENTS = 18;
        const MAJOR_RADIUS = 1.1; // Radius of 90-degree curved tube arc
        const TUBE_RADIUS = 0.32; // Thickness of the tube
        
        // Preset Macaron Color Schemes
        const PALETTES = [
            ['#FFB7B2', '#FFDAC1', '#E2F0CB', '#B5EAD7', '#C7CEEA'], // Macaron Dream
            ['#A8E6CF', '#DCEDC1', '#FFD3B6', '#FFAAA5', '#D4B2D8'], // Mint Lavender
            ['#FDE2F0', '#FFCAD4', '#B5E2FA', '#EDAFB8', '#F7AF9D'], // Sunset Pastel
            ['#FF6B6B', '#4ECDC4', '#FFE66D', '#1A535C', '#F7FFF7']  // Candy Pop
        ];

        // System State
        let scene, camera, renderer, controls;
        let segmentGroups = [];       // Array of 18 segment Group containers
        let twistPivots = [];         // Array of 18 pivot objects for rotation
        let segmentMeshes = [];       // Array of 18 segment Tube meshes
        let targetTwistAngles = new Array(NUM_SEGMENTS).fill(0);
        let currentTwistAngles = new Array(NUM_SEGMENTS).fill(0);
        let segmentColors = [];
        
        let selectedSegmentIndex = 0;
        let interactionMode = 'twist'; // 'twist' or 'orbit'
        let materialType = 'glossy';   // 'glossy' or 'matte'
        let isZenMode = false;
        let soundEnabled = true;

        // Physics & Friction properties
        let jointFriction = 0.5; // Resistance to user drag (higher = heavier drag)
        let jointDamping = 0.08;  // Interp lerp damping factor (lower = viscous/heavy feel, higher = quick)

        // Interaction state
        let isDragging = false;
        let draggedSegmentIndex = -1;
        let previousPointerPosition = { x: 0, y: 0 };
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        // Audio Context
        let audioCtx = null;
        let lastSoundTime = 0;

        // --- Custom Quarter-Arc Curve for Tangle 90-degree Elbow ---
        class QuarterArcCurve extends THREE.Curve {
            constructor(radius) {
                super();
                this.radius = radius;
            }
            getPoint(t, optionalTarget = new THREE.Vector3()) {
                const angle = t * (Math.PI / 2);
                const x = this.radius * (1 - Math.cos(angle));
                const z = this.radius * Math.sin(angle);
                return optionalTarget.set(x, 0, z);
            }
        }

        // --- Audio Context Helpers & Synthesizer ---
        function unlockAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playClickSound(pitch = 1.0) {
            if (!soundEnabled) return;
            const now = performance.now();
            if (now - lastSoundTime < 60) return; // Throttle sound frequency
            lastSoundTime = now;

            try {
                unlockAudioContext();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(650 * pitch, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150 * pitch, audioCtx.currentTime + 0.03);

                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.035);
            } catch (e) {
                // Audio context fallback
            }
        }

        // --- Material Factory ---
        function createSegmentMaterial(colorHex) {
            if (materialType === 'glossy') {
                return new THREE.MeshStandardMaterial({
                    color: new THREE.Color(colorHex),
                    roughness: 0.15,
                    metalness: 0.1
                });
            } else {
                return new THREE.MeshStandardMaterial({
                    color: new THREE.Color(colorHex),
                    roughness: 0.85,
                    metalness: 0.05
                });
            }
        }

        // --- Build Tangle Kinematic Chain ---
        function buildTangleModel() {
            initializeColors(PALETTES[0]);

            const rootGroup = new THREE.Group();
            rootGroup.name = "TangleRoot";
            scene.add(rootGroup);

            const curve = new QuarterArcCurve(MAJOR_RADIUS);
            const tubeGeo = new THREE.TubeGeometry(curve, 32, TUBE_RADIUS, 32, false);
            const capGeo = new THREE.TorusGeometry(TUBE_RADIUS + 0.012, 0.035, 16, 32);

            let currentParent = rootGroup;

            const defaultAngles = [
                0, Math.PI/2, 0, -Math.PI/2, 
                0, Math.PI/2, 0, -Math.PI/2,
                0, Math.PI/2, 0, -Math.PI/2,
                0, Math.PI/2, 0, -Math.PI/2,
                0, 0
            ];

            segmentGroups = [];
            twistPivots = [];
            segmentMeshes = [];

            for (let i = 0; i < NUM_SEGMENTS; i++) {
                targetTwistAngles[i] = defaultAngles[i] || 0;
                currentTwistAngles[i] = defaultAngles[i] || 0;

                const segGroup = new THREE.Group();
                segGroup.name = `SegmentGroup_${i}`;
                currentParent.add(segGroup);
                segmentGroups.push(segGroup);

                const twistPivot = new THREE.Group();
                twistPivot.name = `TwistPivot_${i}`;
                twistPivot.rotation.z = currentTwistAngles[i];
                segGroup.add(twistPivot);
                twistPivots.push(twistPivot);

                const material = createSegmentMaterial(segmentColors[i]);

                const tubeMesh = new THREE.Mesh(tubeGeo, material);
                tubeMesh.castShadow = true;
                tubeMesh.receiveShadow = true;
                tubeMesh.userData = { segmentIndex: i };
                twistPivot.add(tubeMesh);
                segmentMeshes.push(tubeMesh);

                const startRing = new THREE.Mesh(capGeo, material);
                startRing.rotation.y = Math.PI / 2;
                startRing.castShadow = true;
                twistPivot.add(startRing);

                const endRing = new THREE.Mesh(capGeo, material);
                endRing.position.set(MAJOR_RADIUS, 0, MAJOR_RADIUS);
                endRing.rotation.y = Math.PI / 2;
                endRing.castShadow = true;
                twistPivot.add(endRing);

                const nextAnchor = new THREE.Group();
                nextAnchor.position.set(MAJOR_RADIUS, 0, MAJOR_RADIUS);
                nextAnchor.rotation.y = Math.PI / 2;
                twistPivot.add(nextAnchor);

                currentParent = nextAnchor;
            }
        }

        // --- Initialize Scene & 3D Environment ---
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color('#f1f5f9');

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 4, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 25;
            controls.minDistance = 3;
            controls.enabled = false; // Default interaction mode is 'twist'

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
            mainLight.position.set(8, 12, 10);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.bias = -0.0001;
            scene.add(mainLight);

            const fillLight = new THREE.DirectionalLight(0xb0d0ff, 0.6);
            fillLight.position.set(-8, -6, -8);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xffe0ee, 0.5);
            rimLight.position.set(0, 10, -10);
            scene.add(rimLight);

            const shadowPlaneGeo = new THREE.PlaneGeometry(30, 30);
            const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.12 });
            const shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
            shadowPlane.rotation.x = -Math.PI / 2;
            shadowPlane.position.y = -3.5;
            scene.add(shadowPlane);

            buildTangleModel();

            window.addEventListener('resize', onWindowResize);
            const canvasEl = renderer.domElement;
            canvasEl.style.touchAction = 'none';

            canvasEl.addEventListener('pointerdown', onPointerDown, { passive: false });
            canvasEl.addEventListener('pointermove', onPointerMove, { passive: false });
            canvasEl.addEventListener('pointerup', onPointerUp);
            canvasEl.addEventListener('pointercancel', onPointerUp);

            window.addEventListener('touchstart', unlockAudioContext, { once: true });
            window.addEventListener('pointerdown', unlockAudioContext, { once: true });

            renderSegmentGrid();
            lucide.createIcons();

            animate();
        }

        // --- Color Palettes & Customizers ---
        function initializeColors(palette) {
            segmentColors = [];
            for (let i = 0; i < NUM_SEGMENTS; i++) {
                segmentColors.push(palette[i % palette.length]);
            }
        }

        function applyPalette(index) {
            const palette = PALETTES[index];
            initializeColors(palette);
            updateAllMaterials();
            renderSegmentGrid();
        }

        function updateAllMaterials() {
            segmentMeshes.forEach((mesh, i) => {
                const mat = createSegmentMaterial(segmentColors[i]);
                mesh.material = mat;
                mesh.parent.children.forEach(child => {
                    if (child.isMesh) child.material = mat;
                });
            });
        }

        function setMaterialType(type) {
            materialType = type;
            document.getElementById('mat-btn-glossy').className = type === 'glossy' 
                ? 'p-3 rounded-2xl border-2 border-indigo-500 bg-indigo-50/60 text-indigo-700 flex flex-col items-center justify-center gap-1.5 transition-all'
                : 'p-3 rounded-2xl border-2 border-transparent bg-slate-100/80 text-slate-600 hover:bg-slate-200/60 flex flex-col items-center justify-center gap-1.5 transition-all';
            
            document.getElementById('mat-btn-matte').className = type === 'matte' 
                ? 'p-3 rounded-2xl border-2 border-indigo-500 bg-indigo-50/60 text-indigo-700 flex flex-col items-center justify-center gap-1.5 transition-all'
                : 'p-3 rounded-2xl border-2 border-transparent bg-slate-100/80 text-slate-600 hover:bg-slate-200/60 flex flex-col items-center justify-center gap-1.5 transition-all';

            updateAllMaterials();
        }

        function renderSegmentGrid() {
            const grid = document.getElementById('segment-grid');
            grid.innerHTML = '';
            for (let i = 0; i < NUM_SEGMENTS; i++) {
                const btn = document.createElement('button');
                btn.className = `h-8 rounded-xl border-2 transition-all flex items-center justify-center text-[10px] font-bold ${
                    i === selectedSegmentIndex ? 'border-indigo-600 scale-110 shadow-md' : 'border-white/80 hover:scale-105'
                }`;
                btn.style.backgroundColor = segmentColors[i];
                btn.innerText = i + 1;
                btn.onclick = () => selectSegment(i);
                grid.appendChild(btn);
            }
        }

        function selectSegment(index) {
            selectedSegmentIndex = index;
            document.getElementById('selected-segment-label').innerText = `關節 #${index + 1}`;
            document.getElementById('segment-color-picker').value = segmentColors[index];
            renderSegmentGrid();

            const mesh = segmentMeshes[index];
            if (mesh && mesh.material) {
                const origColor = mesh.material.color.clone();
                mesh.material.color.setHex(0xffffff);
                setTimeout(() => {
                    mesh.material.color.copy(origColor);
                }, 180);
            }
        }

        function onCustomColorChange(hex) {
            segmentColors[selectedSegmentIndex] = hex;
            const mat = createSegmentMaterial(hex);
            const mesh = segmentMeshes[selectedSegmentIndex];
            if (mesh) {
                mesh.material = mat;
                mesh.parent.children.forEach(child => {
                    if (child.isMesh) child.material = mat;
                });
            }
            renderSegmentGrid();
        }

        // --- Interaction & Dragging Kinematics ---
        function setInteractionMode(mode) {
            interactionMode = mode;
            controls.enabled = (mode === 'orbit');
            
            const hintText = document.getElementById('hint-text');
            const hintIcon = document.getElementById('hint-icon-container');

            if (mode === 'twist') {
                hintText.innerText = "按住並拖曳關節即可扭轉 Tangle 玩具";
                hintIcon.className = "w-2 h-2 rounded-full bg-emerald-500 animate-ping";
                document.getElementById('mode-btn-twist').className = 'p-3 rounded-2xl border-2 border-indigo-500 bg-indigo-50/60 text-indigo-700 flex flex-col items-center justify-center gap-1.5 transition-all';
                document.getElementById('mode-btn-orbit').className = 'p-3 rounded-2xl border-2 border-transparent bg-slate-100/80 text-slate-600 hover:bg-slate-200/60 flex flex-col items-center justify-center gap-1.5 transition-all';
            } else {
                hintText.innerText = "拖曳自由旋轉 3D 全景視角";
                hintIcon.className = "w-2 h-2 rounded-full bg-indigo-500 animate-ping";
                document.getElementById('mode-btn-orbit').className = 'p-3 rounded-2xl border-2 border-indigo-500 bg-indigo-50/60 text-indigo-700 flex flex-col items-center justify-center gap-1.5 transition-all';
                document.getElementById('mode-btn-twist').className = 'p-3 rounded-2xl border-2 border-transparent bg-slate-100/80 text-slate-600 hover:bg-slate-200/60 flex flex-col items-center justify-center gap-1.5 transition-all';
            }
        }

        function onPointerDown(event) {
            if (interactionMode !== 'twist') return;

            unlockAudioContext();

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(segmentMeshes);

            if (intersects.length > 0) {
                isDragging = true;
                draggedSegmentIndex = intersects[0].object.userData.segmentIndex;
                selectSegment(draggedSegmentIndex);
                previousPointerPosition = { x: event.clientX, y: event.clientY };
                if (event.cancelable) event.preventDefault();
            }
        }

        function onPointerMove(event) {
            if (!isDragging || draggedSegmentIndex === -1 || interactionMode !== 'twist') return;
            if (event.cancelable) event.preventDefault();

            const deltaX = event.clientX - previousPointerPosition.x;
            const deltaY = event.clientY - previousPointerPosition.y;
            const delta = Math.abs(deltaX) > Math.abs(deltaY) ? deltaX : -deltaY;

            const baseSensitivity = 0.025;
            const frictionFactor = Math.max(0.15, 1.25 - jointFriction * 0.95);
            const twistDelta = delta * baseSensitivity * frictionFactor;
            
            const oldAngle = targetTwistAngles[draggedSegmentIndex];
            targetTwistAngles[draggedSegmentIndex] += twistDelta;

            if (Math.abs(targetTwistAngles[draggedSegmentIndex] - oldAngle) > (0.12 * frictionFactor)) {
                const pitchMod = 0.8 + (1.0 - jointFriction) * 0.4 + (draggedSegmentIndex % 4) * 0.08;
                playClickSound(pitchMod);
            }

            previousPointerPosition = { x: event.clientX, y: event.clientY };
        }

        function onPointerUp() {
            isDragging = false;
            draggedSegmentIndex = -1;
        }

        // --- Mobile UI Toggle ---
        let mobilePanelOpen = true;
        function toggleMobilePanel() {
            const sidebar = document.getElementById('main-sidebar');
            mobilePanelOpen = !mobilePanelOpen;

            if (mobilePanelOpen) {
                sidebar.classList.remove('translate-y-[120%]', 'opacity-0', 'pointer-events-none');
                sidebar.classList.add('translate-y-0', 'opacity-100');
            } else {
                sidebar.classList.add('translate-y-[120%]', 'opacity-0', 'pointer-events-none');
                sidebar.classList.remove('translate-y-0', 'opacity-100');
            }
        }

        // --- Shape Presets & Animation Controls ---
        function applyShapePreset(preset) {
            if (isZenMode) {
                document.getElementById('zen-toggle').checked = false;
                toggleZenMode(false);
            }

            const presets = {
                'ring': [0, Math.PI/2, 0, -Math.PI/2, 0, Math.PI/2, 0, -Math.PI/2, 0, Math.PI/2, 0, -Math.PI/2, 0, Math.PI/2, 0, -Math.PI/2, 0, 0],
                'wave': [0, Math.PI/3, Math.PI/3, 0, -Math.PI/3, -Math.PI/3, 0, Math.PI/3, Math.PI/3, 0, -Math.PI/3, -Math.PI/3, 0, Math.PI/3, Math.PI/3, 0, -Math.PI/3, 0],
                'infinity': [0, Math.PI/2, Math.PI, -Math.PI/2, 0, Math.PI/2, Math.PI, -Math.PI/2, 0, Math.PI/2, Math.PI, -Math.PI/2, 0, Math.PI/2, Math.PI, -Math.PI/2, 0, 0],
                'random': Array.from({ length: NUM_SEGMENTS }, () => (Math.floor(Math.random() * 4) * Math.PI / 2))
            };

            const targetArray = presets[preset] || presets['ring'];
            for (let i = 0; i < NUM_SEGMENTS; i++) {
                targetTwistAngles[i] = targetArray[i];
            }
            playClickSound(1.2);
        }

        function resetForm() {
            applyShapePreset('ring');
        }

        function toggleZenMode(enabled) {
            isZenMode = enabled;
        }

        function toggleSound(enabled) {
            soundEnabled = enabled;
        }

        function updatePhysicsParam(param, value) {
            const val = parseFloat(value);
            if (param === 'friction') {
                jointFriction = val;
                let label = "中等沉重";
                if (val < 0.3) label = "輕盈流暢";
                else if (val > 0.7) label = "緊實沉重";
                document.getElementById('val-friction').innerText = `${label} (${val.toFixed(2)})`;
            } else if (param === 'damping') {
                jointDamping = val;
                let label = "適中";
                if (val < 0.05) label = "高黏滯沉穩";
                else if (val > 0.15) label = "彈性敏捷";
                document.getElementById('val-damping').innerText = `${label} (${val.toFixed(2)})`;
            }
        }

        // --- Tab Navigation Switcher ---
        function switchTab(tabName) {
            const styleTabBtn = document.getElementById('tab-btn-style');
            const playTabBtn = document.getElementById('tab-btn-play');
            const styleTabContent = document.getElementById('tab-content-style');
            const playTabContent = document.getElementById('tab-content-play');

            if (tabName === 'style') {
                styleTabBtn.className = "flex-1 py-2.5 px-3 rounded-2xl text-xs md:text-sm font-bold flex items-center justify-center gap-2 transition-all duration-200 bg-white text-indigo-600 shadow-sm";
                playTabBtn.className = "flex-1 py-2.5 px-3 rounded-2xl text-xs md:text-sm font-bold flex items-center justify-center gap-2 transition-all duration-200 text-slate-500 hover:text-slate-800";
                styleTabContent.classList.remove('hidden');
                playTabContent.classList.add('hidden');
            } else {
                playTabBtn.className = "flex-1 py-2.5 px-3 rounded-2xl text-xs md:text-sm font-bold flex items-center justify-center gap-2 transition-all duration-200 bg-white text-indigo-600 shadow-sm";
                styleTabBtn.className = "flex-1 py-2.5 px-3 rounded-2xl text-xs md:text-sm font-bold flex items-center justify-center gap-2 transition-all duration-200 text-slate-500 hover:text-slate-800";
                playTabContent.classList.remove('hidden');
                styleTabContent.classList.add('hidden');
            }
        }

        // --- Center of Mass Auto-Centering ---
        function updateCenterOfMass() {
            const root = scene.getObjectByName("TangleRoot");
            if (!root) return;

            const bbox = new THREE.Box3().setFromObject(root);
            const center = new THREE.Vector3();
            bbox.getCenter(center);

            root.position.lerp(center.negate(), 0.05);
        }

        // --- Window Resize Handler ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Main Render Loop ---
        function animate(time) {
            requestAnimationFrame(animate);

            if (isZenMode && time) {
                const t = time * 0.0015;
                for (let i = 0; i < NUM_SEGMENTS; i++) {
                    targetTwistAngles[i] += Math.sin(t + i * 0.4) * 0.015;
                }
            }

            for (let i = 0; i < NUM_SEGMENTS; i++) {
                currentTwistAngles[i] += (targetTwistAngles[i] - currentTwistAngles[i]) * jointDamping;
                if (twistPivots[i]) {
                    twistPivots[i].rotation.z = currentTwistAngles[i];
                }
            }

            updateCenterOfMass();
            controls.update();
            renderer.render(scene, camera);
        }

        // Start Application on Window Load
        window.onload = () => {
            init();
        };
    </script>
</body>
